<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log-in</title>
    <!-- favicon-->
    <link rel="shortcut icon" href="https://i.postimg.cc/T1HtPsFn/favicon-96x96.png" type="image/x-icon">

    <style>
        .login-section{
    padding: 5rem 9%;
    background:#f9a8d4;
}

.login-box{
    max-width: 400px;
    margin: auto;
    background: #fdf1f5;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 .5rem 1rem rgba(0,0,0,.1);
    text-align: center;
}

.login-box h2{
    font-size: 3rem;
    color:#333;
    margin-bottom: 20px;
}

.login-box input{
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: .1rem solid rgba(0,0,0,.1);
    border-radius: .5rem;
    font-size: 1.5rem;
}

.login-box button{
   padding: 12px 25px;
       background: #db2777;
       color: white;
       border: none;
       border-radius: 25px;
       font-size: 16px;
       cursor: pointer;
       transition: 0.3s;
}

 .password-box{
    position: relative;
}

.show-password{
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 18px;
}

    </style>
</head>
<body>
<section class="login-section">

    <div class="login-box">

        <h2>Login 🌸</h2>

        <input type="text"
               id="loginName"
               placeholder="Enter Your Name">



        <input type="email"
               id="loginEmail"
               placeholder="Enter Your Email" required>


        <div class="password-box">

            <input type="password"
                   id="loginPassword"
                   placeholder="Enter Your Password">

            <span onclick="togglePassword()" class="show-password">

         <i class="fa-solid fa-eye"></i>

    </span>
        </div>

        <button onclick="loginUser()" class="btn">
            login to your account
        </button>

    </div>

</section>
<script>

    function loginUser(){

       let email = document.getElementById("loginEmail").value;
       let password = document.getElementById("loginPassword").value;

       let savedEmail = localStorage.getItem("userEmail");
       let savedPassword = localStorage.getItem("userPassword");

       if(email === savedEmail && password === savedPassword){
          alert("Login successful 🌷");
          window.location.href = "home.html";
       }
       else{
          alert("Wrong email or password");
       }
    }

</script>
</body>
</html>
